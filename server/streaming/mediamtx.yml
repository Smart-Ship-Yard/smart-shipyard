###############################################################################
# mediamtx — 중앙 미디어 서버 설정 (서버 노트북 192.168.0.5)
#
# 젯슨이 H.264 로 한 번만 인코딩해 여기로 밀어올리고(RTSP push),
# 브라우저들은 여기에 WebRTC 로 붙는다. 백엔드(FastAPI)와는 **별개 프로세스**다.
#
#   젯슨 ──H.264 1개, RTSP push──▶ mediamtx(여기) ──WebRTC──▶ 브라우저 N명
#
# ★ 여기 없는 항목은 전부 mediamtx 기본값이다.
#   젯슨의 edge/streaming/mediamtx.yml 은 38KB 짜리 스톡 파일인데, 실제로 바꾼
#   값이 하나도 없었다(전부 주석과 기본값). 그것을 그대로 복사하면 "우리가 무엇을
#   정했는지"가 파묻히므로, 정한 것만 남기고 나머지는 기본값에 맡긴다.
#   기본값 전체를 보려면: ~/mediamtx/mediamtx.yml (배포판 원본)
###############################################################################

logLevel: info
logDestinations: [stdout]        # systemd 가 journal 로 받는다

# 젯슨과 같은 개방 정책을 유지한다.
#   ⚠️ 지금은 같은 망의 누구나 보고, 누구나 송출할 수 있다.
#   백엔드에 로그인이 생기면 authMethod: http + authHTTPAddress 로 묶는다.
#   mediamtx 에만 비밀번호를 거는 것은 의미가 없다 — 프론트 소스에 그 비밀번호가
#   박히기 때문이다. 현장 적용 전 반드시 막을 것.
authMethod: internal

paths:
  # 젯슨이 rtsp://192.168.0.5:8554/ugv1 로 밀어올린다.
  # all_others = 이름을 정하지 않은 모든 경로 허용 (젯슨 설정과 동일).
  # 로봇을 늘리면 ugv2, ugv3 이 설정 변경 없이 그대로 붙는다.
  all_others:

# 재생(playback) API. 녹화한 것을 시각으로 잘라 꺼내려면 필요하다.
#   http://192.168.0.5:9996/get?path=ugv1&start=<ISO시각>&duration=15
#   이벤트의 timestamp 로 그 순간 영상을 뽑는 용도다.
# 제어 API. 대시보드의 녹화 시작/정지 버튼이 백엔드를 거쳐 이걸 부른다.
#
# ★ 127.0.0.1 로만 연다.
#   이 API 는 설정을 바꿀 수 있어 밖에 노출하면 안 된다. 백엔드가 같은 노트북에
#   있으므로 루프백이면 충분하고, 방화벽에 포트를 열 필요도 없다.
api: true
apiAddress: 127.0.0.1:9997

playback: true

pathDefaults:
  # ── 녹화 ──────────────────────────────────────────────────────────────
  # ⚠️ recordDeleteAfter 없이 켜면 디스크가 찬다. 둘은 항상 같이 간다.
  #
  #   실측 1.2 Mbps (2026-08-29, 젯슨→서버 152 KB/s):
  #     시간당 약 540 MB · 하루 약 13 GB
  #
  #   보관 2시간 = 약 1 GB. 아주 가볍다.
  #   (48시간이면 25 GB 로 이 노트북에서도 감당은 되지만, 지금 필요한 것은
  #    "방금 무슨 일이 있었나" 를 되짚는 것이라 2시간이면 충분하다.
  #    더 길게 두려면 늘리되 df -h 로 여유를 먼저 본다)
  #
  #   실측 (2026-08-29, 1분간 측정): 8.7 MB/분 = 시간당 525 MB
  #
  #   녹화 파일은 저장소 밖(~/mediamtx/recordings/)에 쌓인다.
  #   systemd 유닛의 WorkingDirectory 가 ~/mediamtx 라 이 상대경로가 거기에 붙는다.
  record: true
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordSegmentDuration: 1h
  recordDeleteAfter: 2h
