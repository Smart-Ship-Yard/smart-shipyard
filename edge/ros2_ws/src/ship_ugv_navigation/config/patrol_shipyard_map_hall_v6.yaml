# ==========================================================================
#  patrol_shipyard_map_hall_v6.yaml — shipyard_map_hall_v6 맵의 순찰 원
# ==========================================================================
#  ⚠️ 이 파일은 check_patrol_space.py 가 자동으로 만든다. 손으로 고치지 말 것.
#     맵을 다시 만들면 finalize_map.py 가 이 파일도 다시 쓴다.
#
#  navigation.launch.py 가 map 인자를 보고 patrol_<맵이름>.yaml 을 찾아
#  자동으로 로드한다. 따로 지정할 일이 없다.
#
#      ros2 launch ship_ugv_navigation navigation.launch.py \
#          map:=shipyard_map_hall_v6 patrol:=true ...
#
#  ── 이 값들이 나온 근거 ────────────────────────────────────────────
#  중심·반지름: 실제 footprint 를 원 위에서 한 바퀴 쓸어보며 통과 가능한
#               반지름을 찾은 결과. 추측이 아니라 맵 픽셀 검사 결과다.
#      최소 여유 0.225 m
#
#  웨이포인트 개수: 아래 두 제약으로 계산
#      ① 방향 변화 360/N < 40도  (넘으면 지점마다 제자리 회전이 필요)
#      ② 지점 간격 >= 도달반경 0.15 m 의 1.5배
#      -> N=12: 방향 변화 30도, 지점 간격 0.518 m (도달반경의 3.45배)
#
# ==========================================================================

patrol_mission_node:
  ros__parameters:
    center_x: 0.149
    center_y: -1.042
    radius: 1.00
    num_waypoints: 12

    # 시계방향 = 로봇 오른쪽 90도에 달린 카메라가 중앙 대상을 향한다
    direction: cw
