# ==========================================================================
#  patrol_shipyard_map_JG_room_v2.yaml — shipyard_map_JG_room_v2 맵의 순찰 원
# ==========================================================================
#  ⚠️ 이 파일은 check_patrol_space.py 가 자동으로 만든다. 손으로 고치지 말 것.
#     맵을 다시 만들면 finalize_map.py 가 이 파일도 다시 쓴다.
#
#  navigation.launch.py 가 map 인자를 보고 patrol_<맵이름>.yaml 을 찾아
#  자동으로 로드한다. 따로 지정할 일이 없다.
#
#      ros2 launch ship_ugv_navigation navigation.launch.py \
#          map:=shipyard_map_JG_room_v2 patrol:=true ...
#
#  ── 이 값들이 나온 근거 ────────────────────────────────────────────
#  중심·반지름: 실제 footprint 를 원 위에서 한 바퀴 쓸어보며 통과 가능한
#               반지름을 찾은 결과. 추측이 아니라 맵 픽셀 검사 결과다.
#      최소 여유 0.075 m
#
#  웨이포인트 개수: 아래 두 제약으로 계산
#      ① 방향 변화 360/N < 40도  (넘으면 지점마다 제자리 회전이 필요)
#      ② 지점 간격 >= 도달반경 0.15 m 의 1.5배
#      -> N=10: 방향 변화 36도, 지점 간격 0.185 m (도달반경의 1.24배)
#
#  ⚠️ 경고
#     반지름 0.30 m 가 작아 두 제약을 동시에 만족할 수 없다. 회전을 피하는 쪽(N=10, 방향변화 36도)을 택했고 지점
#     간격은 0.185 m 로 도달반경의 1.24배뿐이다. 순찰은 돌지만 궤적이 헐거워진다. 대상 주변을 더 치우고 재매핑해
#     반지름을 0.45 m 이상으로 키우는 것이 근본 해결이다.
#
#  🟡 이 맵은 여유가 0.1 m 미만이다.
#     사람이 막아서면 우회할 공간이 없어 대기(BLOCKED)로 들어간다.
#     그것이 올바른 동작이다 — 비집고 가는 편이 위험하다.
#     space:=narrow 를 반드시 함께 준다 (inflation 0.25 로는 경로가 안 나온다).
#
# ==========================================================================

patrol_mission_node:
  ros__parameters:
    center_x: 3.457
    center_y: 0.543
    radius: 0.30
    num_waypoints: 10

    # 시계방향 = 로봇 오른쪽 90도에 달린 카메라가 중앙 대상을 향한다
    direction: cw
