# ============================================================================
#  space_wide.yaml — 넓은 곳용 덮어쓰기  (시연장 / demo_room)
# ============================================================================
#  nav2_params.yaml 위에 겹쳐 로드된다. **여기 적힌 값만** 덮어쓰고 나머지는
#  전부 nav2_params.yaml 값이 그대로 쓰인다.
#
#      ros2 launch ship_ugv_navigation navigation.launch.py space:=wide ...
#
#  ⚠️ 이 파일에 값을 추가하지 말 것. 장소와 무관한 값은 nav2_params.yaml 에
#     둔다. 여기 늘어날수록 두 space 파일이 어긋날 위험이 커진다.
#     지금 담당하는 것은 아래 3개뿐이고, 4번째 차이(spin)는 launch 가
#     navigate_with_spin.xml 을 골라주는 것으로 처리된다.
#
#  ── 왜 넓은 곳은 값이 달라야 하나 ────────────────────────────────────────
#  좁은 방 값(inflation 0.10)을 넓은 곳에 그대로 가져가면 더 좋아지는 것이
#  아니라 나빠진다.
#      - 벽에 10 cm 까지 붙어 다닌다. 위험하고 시연에서 불안해 보인다
#      - 로컬 코스트맵 2x2 는 시야가 좁아 먼 장애물을 늦게 인지한다
#  공간 여유가 있으면 넉넉히 잡는 편이 안전하고 보기에도 안정적이다.
#
#  ── 시연 당일 이 값도 안 맞으면 ──────────────────────────────────────────
#  이 파일의 숫자만 고치면 된다. nav2_params.yaml 은 건드리지 않는다.
#      경로를 못 찾는다      -> inflation_radius 를 줄인다 (0.20 -> 0.18, 하한 0.17)
#      장애물을 늦게 본다    -> width/height 를 키운다 (5 -> 6)
# ============================================================================

local_costmap:
  local_costmap:
    ros__parameters:
      # 0.15 m/s 로 주행할 때 전방 2.5 m 를 본다. 사람이 걸어들어와도
      # 감속·우회할 시간이 충분하다.
      width: 5
      height: 5
      inflation_layer:
        # ★ 0.25 -> 0.20 (2026-08-18). 사람이 순찰 경로에 서 있을 때
        #   옆으로 빠져나갈 경로를 더 잘 찾게 하려는 것이다.
        #   맵 계산상 순찰 원 바깥 여유는 각도별로 0.30~2.04 m 인데,
        #   좁은 쪽(240/270/300도, 0.30~0.38 m)에서는 사람 + 부풀림 0.25 가
        #   통로를 완전히 막아버린다. 0.20 이면 5 cm 가 열린다.
        #
        #   ⚠️ 더 줄일 때의 하한은 0.17 이다:
        #        로봇 내접반경 0.089 + AMCL 위치 오차 실측 0.08 = 0.169
        #      그 밑으로 내리면 위치추정 오차만으로 벽에 닿을 수 있다.
        #      0.18 도 가능은 하지만 여유가 1 cm 뿐이라 권하지 않는다.
        inflation_radius: 0.20

global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        # local 과 같은 이유로 0.25 -> 0.20. 전역 경로가 사람 옆을
        # 지나가는 길을 아예 못 찾으면 우회 자체가 시작되지 않는다.
        inflation_radius: 0.20
