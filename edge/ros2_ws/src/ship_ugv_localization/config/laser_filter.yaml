/**:
  ros__parameters:
    filter1:
      name: angle_filter_back
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        # ★ 2026-08-15 재조정: base_link_to_laser_tf가 yaw 180도라 라이다 원점(0도)이
        #   로봇 정후방과 일치한다. 공유기/UWB 판이 좌우 대칭으로 가리므로 원점 기준
        #   대칭 ±75도(총 150도)만 지운다 — 기존 비대칭 180도 값보다 좌우 15도씩 더 본다.
        lower_angle: -1.3090   # -75도
        upper_angle: 1.3090    # 75도 (이 사이, 즉 정후방 150도가 지워짐)

    filter2:
      name: range_filter
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.15
        upper_threshold: 12.0
        lower_replacement_value: .nan
        upper_replacement_value: .inf

    filter3:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0
        max_range: 12.0
        max_range_difference: 0.1
        filter_window: 2